spring.application.name=microservicios-examenes

#Asigna el puerto de cada instancia de manera aleatoria
server.port=${PORT :0}

#asigna el id de cada instancia de manera aleatoria
eureka.instance.instance-id=${spring.application.name}:${random.value}

#Le indica en que puerto se despliega eureka para conectarse y autodescrubrirse con los otros microservicios

eureka.client.service-url.defaultZone=http://localhost:8761/eureka




 #nombre local del archivo de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/db_microservicios_examenes


#usuario root 123456
spring.datasource.username=postgres

#contraseña trabajo
spring.datasource.password=123456

#spring.datasource.password=20032003

#genera las tablas que tiene en los Script de manera automatica
# hibernate no permite valores booleanos ademas true siempre va a crear y borrar dat
spring.jpa.hibernate.ddl-auto=update

#permite imprimir todas las http Request en consola web
logging.level.org.hibernate.SQL=debug
